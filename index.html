<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bad Vöslau ↔ Wien Hbf Train Departures</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #17232b;
        background: #fff;
        --muted: #4d5c64;
        --divider: #dce3e7;
        --accent: #075c57;
        --warning: #854200;
        --error: #a12525;
      }

      body {
        margin: 0;
      }

      main {
        box-sizing: border-box;
        max-inline-size: 36rem;
        margin-inline: auto;
        padding: 0.75rem 1rem 1.5rem;
      }

      button,
      input {
        box-sizing: border-box;
        font: inherit;
      }

      button,
      summary {
        cursor: pointer;
      }

      button:focus-visible,
      input:focus-visible,
      summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .directions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0.5rem;
      }

      .directions button {
        min-block-size: 44px;
        padding: 0.4rem 0.3rem;
        border: 1px solid var(--divider);
        border-radius: 0.5rem;
        background: #fff;
        color: inherit;
        font-size: 0.875rem;
        font-weight: 650;
        line-height: 1.25;
      }

      .directions button[aria-pressed="true"] {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .departures {
        margin: 0.5rem 0 0;
        padding: 0;
        list-style: none;
      }

      .departures:empty,
      .departure-message:empty,
      #telegramFeedback:empty {
        display: none;
      }

      .departures li {
        display: grid;
        grid-template-columns: minmax(4ch, 6.5rem) minmax(0, 1fr) minmax(0, 6.5rem);
        align-items: center;
        gap: 0.5rem;
        min-block-size: 3.35rem;
        padding-block: 0.15rem;
        border-bottom: 1px solid var(--divider);
      }

      .departure-time {
        font-size: 1.625rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
      }

      .train-line,
      .platform {
        overflow-wrap: anywhere;
      }

      .train-line {
        font-weight: 600;
      }

      .platform {
        color: var(--muted);
        text-align: end;
      }

      .disruption:not([hidden]) {
        display: block;
      }

      .disruption {
        color: var(--warning);
        font-size: 0.875rem;
        font-weight: 600;
      }

      .departure-message,
      .last-updated,
      .platform {
        font-size: 0.875rem;
      }

      .departure-message,
      .last-updated {
        margin: 0.75rem 0 0;
        color: var(--muted);
      }

      .warning-text {
        color: var(--warning);
      }

      .error-text {
        color: var(--error);
      }

      .success-text {
        color: var(--accent);
      }

      details {
        margin-top: 0.75rem;
        border-top: 1px solid var(--divider);
      }

      summary {
        box-sizing: border-box;
        min-block-size: 44px;
        padding-block: 0.75rem;
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 600;
      }

      form {
        padding-bottom: 0.5rem;
      }

      form p {
        margin: 0 0 0.75rem;
      }

      fieldset {
        min-inline-size: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }

      .field {
        margin-bottom: 0.75rem;
      }

      .field label {
        display: block;
        margin-bottom: 0.25rem;
        font-weight: 600;
      }

      .field input {
        display: block;
        inline-size: 100%;
        min-block-size: 44px;
        padding: 0.5rem;
        color: inherit;
        border: 1px solid #839298;
        border-radius: 0.375rem;
      }

      .field small {
        display: block;
        margin-top: 0.25rem;
        color: var(--muted);
      }

      .form-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .form-actions button {
        min-block-size: 44px;
        padding: 0.5rem 0.75rem;
        border: 1px solid var(--accent);
        border-radius: 0.375rem;
        background: #fff;
        color: var(--accent);
      }

      .form-actions button[type="submit"] {
        background: var(--accent);
        color: #fff;
      }

      .form-actions button:disabled {
        cursor: default;
        opacity: 0.55;
      }

      #telegramFeedback {
        margin: 0.75rem 0 0;
      }

      @media (max-width: 24rem) {
        .departures li {
          grid-template-columns: minmax(4ch, 5rem) minmax(0, 1fr) minmax(0, 5.5rem);
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Train departures">
      <div class="directions" role="group" aria-label="Direction">
        <button type="button" data-direction="badVoeslauToWien" aria-pressed="false" aria-controls="departures">Bad Vöslau → Wien Hbf</button>
        <button type="button" data-direction="wienToBadVoeslau" aria-pressed="false" aria-controls="departures">Wien Hbf → Bad Vöslau</button>
      </div>
      <p id="departureMessage" class="departure-message" role="status">Loading departures…</p>
      <ul id="departures" class="departures" role="list" aria-label="Departures"></ul>
      <p id="lastUpdated" class="last-updated" hidden>Last updated <time></time></p>

      <details>
        <summary>Telegram alerts</summary>
        <form id="telegramSettings">
          <p id="telegramStatus" role="status">Loading Telegram settings…</p>
          <fieldset id="telegramFields" disabled>
            <div class="field">
              <label for="telegramChatId">Chat ID</label>
              <input id="telegramChatId" required maxlength="100"
                autocomplete="off" spellcheck="false" aria-describedby="telegramChatHelp" />
              <small id="telegramChatHelp">For a private chat, send a message to the bot first.</small>
            </div>
            <div class="field">
              <label for="telegramToken">Bot token</label>
              <input id="telegramToken" type="password" maxlength="200"
                autocomplete="new-password" spellcheck="false" />
            </div>
            <div class="form-actions">
              <button type="submit">Save and send test</button>
              <button id="disableTelegram" type="button" disabled>Disable alerts</button>
            </div>
          </fieldset>
          <p id="telegramFeedback" role="status"></p>
        </form>
      </details>
    </main>

    <template id="trainRow">
      <li>
        <span class="departure-time"></span>
        <span><span class="train-line"></span><span class="disruption" hidden></span></span>
        <span class="platform"></span>
      </li>
    </template>
    <script>
      const REFRESH_INTERVAL_MS = 60000;
      const directionButtons = document.querySelectorAll("[data-direction]");
      const departures = document.getElementById("departures");
      const departureMessage = document.getElementById("departureMessage");
      const lastUpdated = document.getElementById("lastUpdated");
      const updatedTime = lastUpdated.querySelector("time");
      const trainRow = document.getElementById("trainRow");
      const viennaClock = new Intl.DateTimeFormat("de-AT", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        timeZone: "Europe/Vienna",
      });

      let direction = new Date().getHours() < 12 ? "badVoeslauToWien" : "wienToBadVoeslau";
      let snapshot = null;
      let stale = false;
      let initialFailure = false;

      const buildRow = (train) => {
        const row = trainRow.content.cloneNode(true);
        row.querySelector(".departure-time").textContent =
          train.ti && train.ti !== "N/A" ? train.ti : "—";
        row.querySelector(".train-line").textContent = train.pr || "Unknown train";
        if (train.tr) {
          row.querySelector(".platform").textContent = "Platform " + train.tr;
        }

        const disruption = row.querySelector(".disruption");
        if (train.cancelled) {
          disruption.textContent = "Cancelled";
          disruption.classList.add("error-text");
        } else if (train.delay > 0) {
          disruption.textContent = "+" + Math.ceil(train.delay / 60) + " min";
        }
        disruption.hidden = !disruption.textContent;
        return row;
      };

      const renderMessage = () => {
        if (!snapshot) {
          departureMessage.textContent = initialFailure ? "Couldn’t load departures." : "Loading departures…";
          departureMessage.classList.toggle("error-text", initialFailure);
          return;
        }

        departureMessage.classList.remove("error-text");
        departureMessage.classList.toggle("warning-text", stale);
        const emptyMessage = departures.childElementCount ? "" : "No departures.";
        const staleMessage = stale ? "Departures may be out of date." : "";
        departureMessage.textContent = [emptyMessage, staleMessage].filter(Boolean).join(" ");
      };

      const renderDepartures = () => {
        const trains = (snapshot?.[direction] ?? []).filter(Boolean);
        departures.replaceChildren(...trains.map(buildRow));
        renderMessage();
      };

      const selectDirection = (nextDirection) => {
        direction = nextDirection;
        for (const button of directionButtons) {
          button.setAttribute("aria-pressed", String(button.dataset.direction === direction));
        }
        renderDepartures();
      };

      for (const button of directionButtons) {
        button.addEventListener("click", () => selectDirection(button.dataset.direction));
      }
      selectDirection(direction);

      const renderLastUpdated = (isoString) => {
        const date = isoString ? new Date(isoString) : null;
        lastUpdated.hidden = !date || !Number.isFinite(date.getTime());
        if (!lastUpdated.hidden) {
          updatedTime.dateTime = date.toISOString();
          updatedTime.textContent = viennaClock.format(date);
        }
      };

      const loadDepartures = async () => {
        try {
          const response = await fetch("/api/departures");
          if (!response.ok) {
            throw new Error("Couldn’t load departures");
          }
          snapshot = await response.json();
          stale = response.headers.get("X-Data-Stale") === "true";
          renderLastUpdated(snapshot.lastUpdated);
          renderDepartures();
        } catch {
          stale = Boolean(snapshot);
          initialFailure = !snapshot;
          renderMessage();
        }

        setTimeout(loadDepartures, REFRESH_INTERVAL_MS);
      };

      const telegramSettingsPath = "/api/telegram-settings";
      const telegramForm = document.getElementById("telegramSettings");
      const telegramFields = document.getElementById("telegramFields");
      const telegramStatus = document.getElementById("telegramStatus");
      const telegramChatId = document.getElementById("telegramChatId");
      const telegramToken = document.getElementById("telegramToken");
      const disableTelegram = document.getElementById("disableTelegram");
      const telegramFeedback = document.getElementById("telegramFeedback");

      const showTelegramSettings = ({ enabled, chatId, hasToken, issue }) => {
        telegramStatus.textContent = enabled ? "Alerts enabled" : "Alerts disabled";
        telegramFeedback.textContent = issue ?? "";
        telegramFeedback.className = issue ? "error-text" : "";
        telegramChatId.value = chatId ?? "";
        telegramToken.value = "";
        telegramToken.required = !hasToken;
        telegramToken.placeholder = hasToken ? "Leave blank to keep the saved token" : "";
        disableTelegram.disabled = !enabled;
      };

      const loadTelegramSettings = async () => {
        try {
          const response = await fetch(telegramSettingsPath);
          if (!response.ok) {
            throw new Error();
          }
          showTelegramSettings(await response.json());
          telegramFields.disabled = false;
        } catch {
          telegramStatus.textContent = "Unable to load Telegram settings.";
        }
      };

      const updateTelegramSettings = async (input) => {
        telegramFields.disabled = true;
        telegramFeedback.className = "";
        telegramFeedback.textContent = input.enabled ? "Sending test message…" : "Disabling alerts…";
        try {
          const response = await fetch(telegramSettingsPath, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(input),
          });
          const settings = await response.json();
          if (!response.ok) {
            telegramFeedback.className = "error-text";
            telegramFeedback.textContent = settings.error ?? "Unable to update Telegram settings.";
            return;
          }
          showTelegramSettings(settings);
          telegramFeedback.className = settings.warning ? "warning-text" : "success-text";
          telegramFeedback.textContent = settings.warning ??
            (input.enabled ? "Test message sent and settings saved." : "Alerts disabled.");
        } catch {
          telegramFeedback.className = "error-text";
          telegramFeedback.textContent = "Unable to update Telegram settings.";
        } finally {
          telegramFields.disabled = false;
        }
      };

      telegramForm.addEventListener("submit", (event) => {
        event.preventDefault();
        updateTelegramSettings({
          enabled: true,
          chatId: telegramChatId.value,
          botToken: telegramToken.value,
        });
      });
      disableTelegram.addEventListener("click", () => updateTelegramSettings({ enabled: false }));

      loadTelegramSettings();
      loadDepartures();
    </script>
  </body>
</html>
